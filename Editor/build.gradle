buildscript {
    repositories {
        mavenCentral()
    }
}

apply plugin: 'application'
apply plugin: 'java-library'
apply plugin: 'com.github.johnrengelman.shadow'
apply plugin: 'java'
apply plugin: 'org.beryx.runtime'

group = 'Editor UI'

run {
    standardInput = System.in
    if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
        jvmArgs '-XstartOnFirstThread'
    }
}

// In this section you declare the dependencies for your production and test code
dependencies {
    api project(':Client')
    implementation 'io.github.mkpaz:atlantafx-base:2.1.0'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.ikonli:ikonli-materialdesign2-pack:12.3.1'
    // The native production viewport is a GLFW/OpenGL surface presented by
    // Dear ImGui. The JavaFX/AWT viewport remains a transitional compatibility
    // surface; GL handles and shader code stay isolated in Editor.
    def lwjglVersion = '3.4.3'
    implementation "org.lwjglx:lwjgl3-awt:0.2.5"
    implementation "org.lwjgl:lwjgl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-opengl:${lwjglVersion}"
    implementation "org.lwjgl:lwjgl-stb:${lwjglVersion}"
    implementation "io.github.spair:imgui-java-binding:${imguiJavaVersion}"
    implementation "io.github.spair:imgui-java-lwjgl3:${imguiJavaVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-macos:${imguiJavaVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-windows:${imguiJavaVersion}"
    runtimeOnly "io.github.spair:imgui-java-natives-linux:${imguiJavaVersion}"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-windows-arm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-windows-arm64"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-windows-arm64"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-glfw:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-stb:${lwjglVersion}:natives-linux-arm64"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-macos"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-macos-arm64"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-windows-arm64"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-opengl:${lwjglVersion}:natives-linux-arm64"
    api(group: 'org.controlsfx', name: 'controlsfx', version: '11.2.2') {
        exclude group: 'org.openjfx'
    }
    api('com.jfoenix:jfoenix:9.0.10') {
        exclude group: 'org.openjfx'
    }
}

runtime {
    options = ['--strip-debug', '--compress', '2', '--no-header-files', '--no-man-pages']
    modules = [
            'javafx.base',
            'java.desktop',
            'javafx.graphics',
            'javafx.controls',
            'javafx.fxml',
            'javafx.swing',
            'java.naming',
            'java.logging',
            'java.management',
            'java.xml',
            'jdk.unsupported',
            'java.sql',
            'javafx.media',
            'java.scripting',
            'jdk.jfr',
            'jdk.unsupported.desktop',
            'java.datatransfer']

    jpackage {
        installerOptions = [
        ]
        installerType = project.findProperty('installerType') ?: "msi"
// we will pass this from the command line (example: -PinstallerType=msi)
        if (installerType == 'msi') {
            imageOptions += ['--icon', 'src/main/resources/images/logo128.ico']

            installerOptions += [
                    '-t', 'msi',
                    '--win-per-user-install',
                    '--win-dir-chooser',
                    '--win-menu',
                    '--win-shortcut']
            imageOptions += ['--win-console']
        }
        if (installerType == 'pkg') {
            imageOptions += ['--icon', 'src/main/resources/pdfdecorator/gui/icon.icns']
        }
        if (installerType in ['deb', 'rpm']) {
            imageOptions += ['--icon', 'src/main/resources/images/logo128.png']
            installerOptions += [
                    '--linux-menu-group', 'Office',
                    '--linux-shortcut'
            ]
        }
        if (installerType == 'deb') {
            installerOptions += [
                    '--linux-deb-maintainer', 'office@walczak.it'
            ]
        }
        if (installerType == 'rpm') {
            installerOptions += [
                    '--linux-rpm-license-type', 'GPLv3'
            ]
        }
    }

}

application {
    // Keep the dashboard launcher as the single application entry point. The
    // legacy cache/plugin form is only reachable from Dashboard settings.
    mainClass = "com.rspsi.studio.StudioMain"
    applicationName = 'OpenRuneStudio'
}
