description = 'Client'

apply plugin: 'java-library'
apply plugin: 'org.jetbrains.kotlin.jvm'

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

dependencies {
    implementation "org.tomlj:tomlj:1.1.1"
    // OpenRune currently targets Kotlin 2.2.0. PSI is kept behind the server semantic adapter so
    // compiler-internal types never enter Studio's neutral APIs.
    implementation "org.jetbrains.kotlin:kotlin-compiler-embeddable:${openruneKotlinSemanticVersion}"
    // Displee is retained only for legacy/custom-cache compatibility. Modern OSRS
    // projects, definitions, reference-cache acquisition and writable outputs use
    // OpenRune FileStore. Boundary tasks below prevent this dependency from
    // becoming a second modern-OSRS backend.
    implementation 'com.displee:rs-cache-library:7.3.0'
    implementation 'com.displee:disio:2.3'

    // Canonical modern-OSRS cache/definition backend. OpenRune types are reduced
    // immediately to Studio-owned neutral interfaces at the cache boundary.
    // The version is pinned in gradle.properties and catalogued in
    // docs/OPENRUNE_MAVEN_CATALOG.md.
    implementation "dev.or2:filesystem:${openruneFileStoreVersion}"
    implementation "dev.or2:filestore:${openruneFileStoreVersion}"
    implementation "dev.or2:osrs-fs:${openruneFileStoreVersion}"
    implementation "dev.or2:osrs:${openruneFileStoreVersion}"
    implementation "dev.or2:definition:${openruneFileStoreVersion}"
    // OpenRune definition codecs expose ByteBuf in their public encode API,
    // but the module keeps Netty as an implementation dependency.
    implementation "io.netty:netty-buffer:4.1.107.Final"
    // Explicit OpenRune toolchain boundary. Production uses CacheDelegate for
    // separately selected writable output caches; opt-in verification tooling
    // also uses FreshCache/OpenRS2 to prepare external reference caches.
    implementation("dev.or2:tools:${openruneFileStoreVersion}") {
        // The tools module also brings the CS2 compiler toolchain. Studio's
        // current CacheDelegate/FreshCache consumers do not use it, so keep
        // that optional capability out until the CS2 authoring phase has a
        // real production consumer.
        exclude group: 'me.filby', module: 'clientscript-compiler'
    }

    api group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'
    api group: 'org.tukaani', name: 'xz', version: '1.10'
    api group: 'org.brotli', name: 'dec', version: '0.1.2'
    api group: 'com.google.guava', name: 'guava', version: '33.4.8-jre'
    api group: 'com.fasterxml.jackson.core', name: 'jackson-core', version: '2.19.2'
    api group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.19.2'
    api group: 'net.coobird', name: 'thumbnailator', version: '0.4.20'
    api group: 'org.jfree', name: 'fxgraphics2d', version: '1.8'
    api group: 'org.quartz-scheduler', name: 'quartz', version: '2.5.0'
    api group: 'org.greenrobot', name: 'eventbus-java', version: '3.3.1'
    api group: 'com.github.jponge', name: 'lzma-java', version: '1.3'
    api group: 'org.apache.commons', name: 'commons-compress', version: '1.27.1'
}

// Architecture guards must follow the code across the Java -> Kotlin migration.
def neutralCoreSources = files(
        fileTree('src/main/java/com/rspsi/editor') { include '**/*.java' },
        fileTree('src/main/kotlin/com/rspsi/editor') { include '**/*.kt' },
        fileTree('src/main/java/com/rspsi/osrs') { include '**/*.java' },
        fileTree('src/main/kotlin/com/rspsi/osrs') { include '**/*.kt' },
        fileTree('src/main/java/com/rspsi/cache') {
            include '**/*.java'
            exclude 'store/**', 'workspace/**', 'verify/**'
        },
        fileTree('src/main/kotlin/com/rspsi/cache') {
            include '**/*.kt'
            exclude 'store/**', 'workspace/**', 'verify/**'
        },
        fileTree('src/main/java/com/rspsi/project') { include '**/*.java' },
        fileTree('src/main/kotlin/com/rspsi/project') { include '**/*.kt' }
)

tasks.register('verifyUiNeutralCore') {
    description = 'Rejects frontend, cache, and renderer-backend imports from neutral editor APIs.'
    group = 'verification'
    inputs.files(neutralCoreSources)
    doLast {
        def forbidden = [
                'javafx.',
                'imgui.',
                'org.lwjgl.',
                'com.displee.',
                'dev.openrune.',
                'org.openrs2.',
                'org.rsmod.',
                'org.openrune.'
        ]
        neutralCoreSources.files.each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { token -> line.contains(token) }) {
                    throw new GradleException("UI-neutral editor source imports forbidden dependency at ${source}:${number}: ${line.trim()}")
                }
            }
        }
    }
}

def cacheBackendSources = files(
        fileTree('src/main/java') { include '**/*.java' },
        fileTree('src/main/kotlin') { include '**/*.kt' }
)

// Adapter allowlists are language-neutral too: moving an approved boundary class
// from Java to Kotlin must not weaken or accidentally invalidate the boundary.
def boundarySourcePaths = { javaRelativePaths ->
    javaRelativePaths.collectMany { relative ->
        def stem = relative.endsWith('.java')
                ? relative.substring(0, relative.length() - '.java'.length())
                : relative
        [
                file("src/main/java/${relative}").canonicalPath,
                file("src/main/kotlin/${stem}.kt").canonicalPath
        ]
    }
}

def legacyDispleeBoundaryFiles = boundarySourcePaths([
        'com/jagex/Cache.java',
        'com/jagex/cache/def/TextureDef.java',
        'com/jagex/cache/graphics/IndexedImage.java',
        'com/jagex/cache/graphics/Sprite.java',
        'com/rspsi/cache/store/LegacyDispleeCacheStore.java',
        'org/displee/util/GZIPUtils.java'
])

def openRuneBoundaryFiles = boundarySourcePaths([
        'com/rspsi/cache/store/CacheStoreFactory.java',
        'com/rspsi/cache/store/OpenRuneCacheStore.java',
        'com/rspsi/cache/store/OpenRuneTextureDefinitionDecoder.java',
        'com/rspsi/cache/store/OpenRuneDefinitionProvider.java',
        'com/rspsi/cache/store/OpenRuneObjectDefinitionEditTransaction.java',
        'com/rspsi/cache/store/OpenRuneCacheInspector.java',
        'com/rspsi/cache/store/OpenRuneReferenceCacheBootstrap.java',
        'com/rspsi/cache/store/OpenRuneSymbolicNameProvider.java'
])

tasks.register('verifyCacheBackendBoundary') {
    description = 'Enforces separate legacy-Displee and modern-OpenRune cache adapter boundaries.'
    group = 'verification'
    inputs.files(cacheBackendSources)
    doLast {
        cacheBackendSources.files.each { source ->
            source.eachLine { line, number ->
                if ((line.contains('com.displee.') || line.contains('org.displee.'))
                        && !legacyDispleeBoundaryFiles.contains(source.canonicalPath)) {
                    throw new GradleException("Displee escaped the legacy-cache boundary at ${source}:${number}: ${line.trim()}")
                }
                if (line.contains('dev.openrune.')
                        && !openRuneBoundaryFiles.contains(source.canonicalPath)) {
                    throw new GradleException("OpenRune FileStore type escaped its adapter boundary at ${source}:${number}: ${line.trim()}")
                }
            }
        }
    }
}

def modernOsrsSources = files(
        fileTree('src/main/java/com/rspsi/cache/map') { include '**/*.java' },
        fileTree('src/main/kotlin/com/rspsi/cache/map') { include '**/*.kt' },
        fileTree('src/main/java/com/rspsi/cache/workspace') { include '**/*.java' },
        fileTree('src/main/kotlin/com/rspsi/cache/workspace') { include '**/*.kt' },
        fileTree('src/main/java/com/rspsi/project') { include '**/*.java' },
        fileTree('src/main/kotlin/com/rspsi/project') { include '**/*.kt' },
        fileTree('src/main/java/com/rspsi/server') { include '**/*.java' },
        fileTree('src/main/kotlin/com/rspsi/server') { include '**/*.kt' }
)

tasks.register('verifyModernOsrsBackend') {
    description = 'Prevents modern OSRS project/cache code from regaining a Displee backend or plugin-named OpenRune integration.'
    group = 'verification'
    inputs.files(modernOsrsSources)
    doLast {
        def forbidden = [
                'LegacyDispleeCacheStore',
                'CacheStoreFactory.legacy(',
                'openWithDisplee',
                'openRuneWithDisplee',
                'com.rspsi.plugins.server.openrune'
        ]
        modernOsrsSources.files.each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { token -> line.contains(token) }) {
                    throw new GradleException("Modern OSRS ownership violation at ${source}:${number}: ${line.trim()}")
                }
            }
        }
    }
}

tasks.register('verifyRetiredLoaderBoundary') {
    description = 'The old OSRSPlugin service-loader path is retired; renderer loaders live in com.rspsi.compat.osrs.'
    group = 'verification'
    inputs.files(cacheBackendSources)
    doLast {
        cacheBackendSources.files.each { source ->
            source.eachLine { line, number ->
                if (line.contains('com.rspsi.plugin.loader') || line.contains('ClientPluginLoader')) {
                    throw new GradleException("Retired OSRSPlugin loader reference at ${source}:${number}: ${line.trim()}"
                            + ' Use com.rspsi.compat.osrs.OsrsCompatibilityLoaders instead.')
                }
            }
        }
    }
}

tasks.register('verifyCanonicalSettingsBoundary') {
    description = 'Rejects legacy settings access from neutral editor and first-party tool code.'
    group = 'verification'
    inputs.files(neutralCoreSources)
    doLast {
        // Match the actual legacy settings types, not every identifier ending in
        // "Options". The broad "Options." token incorrectly rejects legitimate
        // neutral types such as IntegrationOptions.
        def forbidden = [
                'com.rspsi.options.Options',
                'LegacyRenderSettingsAdapter'
        ]
        neutralCoreSources.files.each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { token -> line.contains(token) }) {
                    throw new GradleException("Legacy settings access escaped the compatibility boundary at ${source}:${number}: ${line.trim()}")
                }
            }
        }
    }
}

tasks.register('verifySettingsContract', JavaExec) {
    description = 'Verifies that every registered setting has a valid declared consumer.'
    group = 'verification'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.rspsi.editor.settings.SettingsContractVerifier'
}

tasks.named('check') {
    dependsOn(tasks.named('verifyUiNeutralCore'))
    dependsOn(tasks.named('verifyCacheBackendBoundary'))
    dependsOn(tasks.named('verifyRetiredLoaderBoundary'))
    dependsOn(tasks.named('verifyModernOsrsBackend'))
    dependsOn(tasks.named('verifyCanonicalSettingsBoundary'))
    dependsOn(tasks.named('verifySettingsContract'))
}
