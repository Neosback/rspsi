# RSPSi build properties.
#
# OpenRune FileStore dependency version. The default is the verified
# production pin tracked in docs/OPENRUNE_MAVEN_CATALOG.md and
# docs/OPENRUNE_ECOSYSTEM_INTEGRATION.md. A compatibility spike may override
# it without editing any build script:
#
#   ./gradlew -PopenruneFileStoreVersion=3.0.3 foundationGate
#
# Any version change is a parity event and must follow the upgrade runbook:
#   1. run `foundationGate` (deterministic suite) with the new pin;
#   2. run `verifyOsrsRevisionMatrix` against the operator parity manifest;
#   3. re-run definition audits and the writable round-trip tests;
#   4. update the Maven catalog / ecosystem integration docs in the same commit.
openruneFileStoreVersion=3.0.3
# Kotlin PSI compatibility pin for semantic indexing. This currently matches the bundled
# OpenRune-Server version catalog and is intentionally independently overrideable.
openruneKotlinSemanticVersion=2.2.0
# Dear ImGui Java binding release tracked by the docking branch.
imguiJavaVersion=1.92.7.1
