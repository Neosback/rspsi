# RSPSi build properties.
#
# OpenRune FileStore dependency version. The default is the verified
# production pin recorded in docs/FILESTORE_CAPABILITY_AUDIT.md. A
# compatibility spike may override it without editing any build script:
#
#   ./gradlew -PopenruneFileStoreVersion=3.0.2 foundationGate
#
# Any version change is a parity event and must follow the upgrade runbook:
#   1. run `foundationGate` (deterministic suite) with the new pin;
#   2. run `verifyOsrsRevisionMatrix` against the operator parity manifest;
#   3. re-run definition audits and the writable round-trip tests;
#   4. update the audit document and resource catalog in the same commit.
openruneFileStoreVersion=3.0.2
