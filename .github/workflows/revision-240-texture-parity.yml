name: Revision 240 Texture Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/map-studio-v1-foundation
    paths:
      - '.github/workflows/revision-240-texture-parity.yml'
      - 'RuneLite-melxin/cache/src/test/java/net/runelite/cache/Revision240TextureParityExporterTest.java'
      - 'Client/src/main/java/com/rspsi/cache/verify/**'
      - 'Client/src/main/java/com/rspsi/cache/store/**'
      - 'docs/TEXTURE_PARITY_FIXTURE.md'

jobs:
  texture-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download OpenRS2 build 240 cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/osrs240"
          curl --fail --location --retry 3 --retry-delay 5 \
            --output "${RUNNER_TEMP}/osrs240.zip" \
            "https://archive.openrs2.org/caches/runescape/2710/disk.zip"
          unzip -q "${RUNNER_TEMP}/osrs240.zip" -d "${RUNNER_TEMP}/osrs240"

          CACHE_DIR="$(find "${RUNNER_TEMP}/osrs240" -type f -name 'main_file_cache.dat2' -printf '%h\n' -quit)"
          if [[ -z "${CACHE_DIR}" ]]; then
            echo "Could not locate main_file_cache.dat2 in OpenRS2 cache 2710" >&2
            find "${RUNNER_TEMP}/osrs240" -maxdepth 3 -type f | head -100 >&2
            exit 1
          fi

          echo "RSPSI_REFERENCE_CACHE=${CACHE_DIR}" >> "${GITHUB_ENV}"
          echo "Reference cache: ${CACHE_DIR}"
          ls -lh "${CACHE_DIR}"/main_file_cache.dat2 "${CACHE_DIR}"/main_file_cache.idx*

      - name: Export independent RuneLite texture fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_DIR="${RUNNER_TEMP}/revision240-fixture"
          mkdir -p "${FIXTURE_DIR}"
          echo "RSPSI_TEXTURE_FIXTURE_OUT=${FIXTURE_DIR}/textures.json" >> "${GITHUB_ENV}"

          cd RuneLite-melxin
          chmod +x gradlew
          RSPSI_REFERENCE_CACHE="${RSPSI_REFERENCE_CACHE}" \
          RSPSI_TEXTURE_FIXTURE_OUT="${FIXTURE_DIR}/textures.json" \
            ./gradlew --no-daemon :cache:exportRevision240TextureParity

          test -s "${FIXTURE_DIR}/textures.json"
          cat "${FIXTURE_DIR}/textures.json"

      - name: Prepare RSPSi parity fixture
        shell: bash
        run: |
          set -euo pipefail
          FIXTURE_DIR="${RUNNER_TEMP}/revision240-fixture"
          cat > "${FIXTURE_DIR}/fixture.properties" <<'EOF'
          region.x=50
          region.y=50
          revision=240
          EOF
          echo "RSPSI_OSRS_PARITY_FIXTURE=${FIXTURE_DIR}" >> "${GITHUB_ENV}"

      - name: Verify RuneLite fixture through RSPSi
        shell: bash
        env:
          RSPSI_OSRS_REVISION: '240'
          RSPSI_OSRS_REGION_X: '50'
          RSPSI_OSRS_REGION_Y: '50'
        run: |
          set -euo pipefail
          RSPSI_OSRS_CACHE="${RSPSI_REFERENCE_CACHE}" \
          RSPSI_OSRS_PARITY_FIXTURE="${RSPSI_OSRS_PARITY_FIXTURE}" \
          RSPSI_OSRS_REVISION=240 \
          RSPSI_OSRS_REGION_X=50 \
          RSPSI_OSRS_REGION_Y=50 \
            gradle --no-daemon verifyOsrsRevision

      - name: Upload texture parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-240-texture-parity
          path: |
            ${{ runner.temp }}/revision240-fixture/textures.json
            ${{ runner.temp }}/revision240-fixture/fixture.properties
          if-no-files-found: warn
