plugins {
    id 'io.freefair.lombok' version '8.14'
    id "com.gradleup.shadow" version "8.3.8" apply false
    id 'application'
    id 'java-library'

    id 'org.beryx.runtime' version '1.13.1' apply false

    id 'org.openjfx.javafxplugin' version '0.1.0'
}

wrapper {
    gradleVersion = '8.14.3'
}

group = 'RSPSi Editor'
version = '1.17.0'

allprojects {
    repositories {
        mavenCentral()
        // OpenRune publishes its dev.or2 modules to this Maven-compatible repo.
        maven { url = uri('https://raw.githubusercontent.com/OpenRune/hosting/main') }
    }
}

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'io.freefair.lombok'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    dependencies {
        api group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.18'
        api group: 'org.checkerframework', name: 'checker-qual', version: '3.49.5'

        api group: 'com.google.guava', name: 'guava', version: '33.4.8-jre'
        api group: 'com.google.code.gson', name: 'gson', version: '2.13.1'

        api group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'

        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    lombok {
        version = "1.18.38"
    }

    compileJava {
        options.fork = true
        options.incremental = true
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    apply plugin: 'org.openjfx.javafxplugin'
    javafx {
        version = "21"
        modules = ['javafx.base', 'javafx.fxml', 'javafx.graphics', 'javafx.controls', 'javafx.media', 'javafx.swing']
    }

}

// The report is intentionally explicit while external parity fixtures remain
// outside the repository: this gate never mutates or silently discovers a
// user cache, and reports real-cache results only when a path is supplied.
tasks.register('verifyOsrsRevision') {
    description = 'Runs the current neutral OSRS cache/map compatibility suite.'
    group = 'verification'
    dependsOn(':Client:check', ':Editor:check')
    doLast {
        def cachePath = providers.environmentVariable('RSPSI_OSRS_CACHE').orNull
        if (cachePath == null || cachePath.isBlank()) {
            logger.lifecycle('OSRS revision verification: neutral map/location and adapter fixtures passed; real-cache parity remains pending.')
        } else {
            def regionX = providers.environmentVariable('RSPSI_OSRS_REGION_X').orNull
            def regionY = providers.environmentVariable('RSPSI_OSRS_REGION_Y').orNull
            def revision = providers.environmentVariable('RSPSI_OSRS_REVISION').orNull
            def regionArguments = [regionX, regionY, revision]
            if (regionArguments.any { it != null } && regionArguments.any { it == null }) {
                throw new GradleException('Set RSPSI_OSRS_REGION_X, RSPSI_OSRS_REGION_Y, and RSPSI_OSRS_REVISION together.')
            }
            def verifierArguments = [cachePath]
            if (regionArguments.every { it != null }) verifierArguments.addAll(regionArguments)
            project(':Client').javaexec {
                def javaLauncher = project(':Client').javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }.get()
                executable = javaLauncher.executablePath.asFile.absolutePath
                classpath = project(':Client').sourceSets.main.runtimeClasspath
                mainClass = 'com.rspsi.cache.verify.OsrsRevisionVerifier'
                args verifierArguments
            }
        }
    }
}

// A repeatable multi-fixture foundation run. Reference caches and fixtures are
// intentionally external to this repository; the manifest makes their paths
// explicit without making them runtime dependencies of the product.
tasks.register('verifyOsrsRevisionMatrix') {
    description = 'Runs verifyOsrsRevision for every case in an explicit JSON parity manifest.'
    group = 'verification'
    dependsOn(':Client:check')
    doLast {
        def manifestPath = providers.environmentVariable('RSPSI_OSRS_PARITY_MANIFEST').orNull
        if (manifestPath == null || manifestPath.isBlank()) {
            logger.lifecycle('OSRS revision matrix verification: pending; set RSPSI_OSRS_PARITY_MANIFEST to an explicit JSON manifest.')
            return
        }
        def manifestFile = file(manifestPath)
        if (!manifestFile.isFile()) {
            throw new GradleException('OSRS parity manifest does not exist: ' + manifestFile)
        }
        def cases = new groovy.json.JsonSlurper().parse(manifestFile)
        if (!(cases instanceof List) || cases.isEmpty()) {
            throw new GradleException('OSRS parity manifest must contain a non-empty JSON array.')
        }
        cases.eachWithIndex { entry, index ->
            if (!(entry instanceof Map)) {
                throw new GradleException('OSRS parity manifest case ' + index + ' must be an object.')
            }
            def required = ['cache', 'fixture', 'regionX', 'regionY', 'revision']
            def missing = required.findAll { key -> entry[key] == null || entry[key].toString().isBlank() }
            if (!missing.isEmpty()) {
                throw new GradleException('OSRS parity manifest case ' + index
                        + ' is missing: ' + missing.join(', '))
            }
            def cachePath = entry.cache.toString()
            def fixturePath = entry.fixture.toString()
            def regionX = entry.regionX.toString()
            def regionY = entry.regionY.toString()
            def revision = entry.revision.toString()
            logger.lifecycle('OSRS revision matrix case ' + (index + 1) + '/' + cases.size()
                    + ': region ' + regionX + ',' + regionY + ' revision ' + revision)
            project(':Client').javaexec {
                def javaLauncher = project(':Client').javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }.get()
                executable = javaLauncher.executablePath.asFile.absolutePath
                classpath = project(':Client').sourceSets.main.runtimeClasspath
                mainClass = 'com.rspsi.cache.verify.OsrsRevisionVerifier'
                environment 'RSPSI_OSRS_PARITY_FIXTURE', fixturePath
                environment 'RSPSI_OSRS_REQUIRE_PARITY',
                        entry.requireParity == null ? 'false' : entry.requireParity.toString()
                args cachePath, regionX, regionY, revision
            }
        }
    }
}

tasks.register('verifyOsrsInstance') {
    description = 'Runs the opt-in external OSRS instance-template parity fixture.'
    group = 'verification'
    dependsOn(':Client:check')
    doLast {
        def cachePath = providers.environmentVariable('RSPSI_OSRS_CACHE').orNull
        def fixturePath = providers.environmentVariable('RSPSI_OSRS_INSTANCE_FIXTURE').orNull
        def revision = providers.environmentVariable('RSPSI_OSRS_REVISION').orNull
        if ([cachePath, fixturePath, revision].any { it == null || it.isBlank() }) {
            logger.lifecycle('OSRS instance verification: external instance fixture remains pending; '
                    + 'set RSPSI_OSRS_CACHE, RSPSI_OSRS_INSTANCE_FIXTURE, and RSPSI_OSRS_REVISION to run it.')
        } else {
            project(':Client').javaexec {
                def javaLauncher = project(':Client').javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }.get()
                executable = javaLauncher.executablePath.asFile.absolutePath
                classpath = project(':Client').sourceSets.main.runtimeClasspath
                mainClass = 'com.rspsi.cache.verify.OsrsInstanceRevisionVerifier'
                args cachePath, fixturePath, revision
            }
        }
    }
}

tasks.register('foundationGate') {
    description = 'Runs the repository foundation checks; external parity is opt-in via environment variables.'
    group = 'verification'
    dependsOn 'test', 'check', 'verifyOsrsRevision', 'verifyOsrsInstance'
}
