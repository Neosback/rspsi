plugins {
    id 'io.freefair.lombok' version '8.14'
    id "com.gradleup.shadow" version "8.3.8" apply false
    id 'application'
    id 'java-library'

    id 'org.beryx.runtime' version '1.13.1' apply false

    id 'org.openjfx.javafxplugin' version '0.1.0'
}

wrapper {
    gradleVersion = '8.14.3'
}

group = 'RSPSi Editor'
version = '1.17.0'

allprojects {
    repositories {
        mavenCentral()
        // OpenRune publishes its dev.or2 modules to this Maven-compatible repo.
        maven { url = uri('https://raw.githubusercontent.com/OpenRune/hosting/main') }
    }
}

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'io.freefair.lombok'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    dependencies {
        api group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.18'
        api group: 'org.checkerframework', name: 'checker-qual', version: '3.49.5'

        api group: 'com.google.guava', name: 'guava', version: '33.4.8-jre'
        api group: 'com.google.code.gson', name: 'gson', version: '2.13.1'

        api group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'

        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    lombok {
        version = "1.18.38"
    }

    compileJava {
        options.fork = true
        options.incremental = true
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    apply plugin: 'org.openjfx.javafxplugin'
    javafx {
        version = "21"
        modules = ['javafx.base', 'javafx.fxml', 'javafx.graphics', 'javafx.controls', 'javafx.media', 'javafx.swing']
    }

}

// Opt-in developer utility. This is intentionally not part of foundationGate:
// it performs network/cache acquisition through OpenRune FileStore FreshCache.
tasks.register('prepareOsrsReferenceCache') {
    description = 'Prepares an OSRS reference cache through OpenRune FileStore FreshCache/OpenRS2 tooling.'
    group = 'verification'
    dependsOn(':Client:classes')
    doLast {
        def output = providers.environmentVariable('RSPSI_OSRS_CACHE').orNull
        def revision = providers.environmentVariable('RSPSI_OSRS_REVISION').orNull
        def subRevision = providers.environmentVariable('RSPSI_OSRS_SUBREVISION').orNull
        if (output == null || output.isBlank() || revision == null || revision.isBlank()) {
            throw new GradleException('Set RSPSI_OSRS_CACHE and RSPSI_OSRS_REVISION. '
                    + 'RSPSI_OSRS_SUBREVISION is optional.')
        }
        project(':Client').javaexec {
            def javaLauncher = project(':Client').javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }.get()
            executable = javaLauncher.executablePath.asFile.absolutePath
            classpath = project(':Client').sourceSets.main.runtimeClasspath
            mainClass = 'com.rspsi.cache.store.OpenRuneReferenceCacheBootstrap'
            args output, revision
            if (subRevision != null && !subRevision.isBlank()) args subRevision
        }
    }
}

// The report is intentionally explicit while external parity fixtures remain
// outside the repository: this gate never mutates or silently discovers a
// user cache, and reports real-cache results only when a path is supplied.
tasks.register('verifyOsrsRevision') {
    description = 'Runs the current neutral OSRS cache/map compatibility suite.'
    group = 'verification'
    dependsOn(':Client:check', ':Editor:check')
    doLast {
        def cachePath = providers.environmentVariable('RSPSI_OSRS_CACHE').orNull
        if (cachePath == null || cachePath.isBlank()) {
            logger.lifecycle('OSRS revision verification: neutral map/location and adapter fixtures passed; real-cache parity remains pending.')
        } else {
            def regionX = providers.environmentVariable('RSPSI_OSRS_REGION_X').orNull
            def regionY = providers.environmentVariable('RSPSI_OSRS_REGION_Y').orNull
            def revision = providers.environmentVariable('RSPSI_OSRS_REVISION').orNull
            def regionArguments = [regionX, regionY, revision]
            if (regionArguments.any { it != null } && regionArguments.any { it == null }) {
                throw new GradleException('Set RSPSI_OSRS_REGION_X, RSPSI_OSRS_REGION_Y, and RSPSI_OSRS_REVISION together.')
            }
            def verifierArguments = [cachePath]
            if (regionArguments.every { it != null }) verifierArguments.addAll(regionArguments)
            project(':Client').javaexec {
                def javaLauncher = project(':Client').javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }.get()
                executable = javaLauncher.executablePath.asFile.absolutePath
                classpath = project(':Client').sourceSets.main.runtimeClasspath
                mainClass = 'com.rspsi.cache.verify.OsrsRevisionVerifier'
                args verifierArguments
            }
        }
    }
}

// A repeatable multi-fixture foundation run. Reference caches and fixtures are
// intentionally external to this repository; the manifest makes their paths
// explicit without making them runtime dependencies of the product.
tasks.register('verifyOsrsRevisionMatrix') {
    description = 'Runs verifyOsrsRevision for every case in an explicit JSON parity manifest.'
    group = 'verification'
    dependsOn(':Client:check')
    doLast {
        def strict = gradle.taskGraph.hasTask(':parityGate')
        def manifestPath = providers.environmentVariable('RSPSI_OSRS_PARITY_MANIFEST').orNull
        if (manifestPath == null || manifestPath.isBlank()) {
            if (strict) {
                throw new GradleException('Set RSPSI_OSRS_PARITY_MANIFEST to run the strict parity gate.')
            }
            logger.lifecycle('OSRS revision matrix verification: pending; set RSPSI_OSRS_PARITY_MANIFEST to an explicit JSON manifest.')
            return
        }
        def manifestFile = file(manifestPath)
        if (!manifestFile.isFile()) {
            throw new GradleException('OSRS parity manifest does not exist: ' + manifestFile)
        }
        def cases = new groovy.json.JsonSlurper().parse(manifestFile)
        if (!(cases instanceof List) || cases.isEmpty()) {
            throw new GradleException('OSRS parity manifest must contain a non-empty JSON array.')
        }
        def strictCoverage = []
        cases.eachWithIndex { entry, index ->
            if (!(entry instanceof Map)) {
                throw new GradleException('OSRS parity manifest case ' + index + ' must be an object.')
            }
            def required = ['cache', 'fixture', 'regionX', 'regionY', 'revision']
            if (strict) required += ['id', 'coverage', 'source', 'cacheFingerprint', 'tolerance']
            def missing = required.findAll { key -> entry[key] == null || entry[key].toString().isBlank() }
            if (!missing.isEmpty()) {
                throw new GradleException('OSRS parity manifest case ' + index
                        + ' is missing: ' + missing.join(', '))
            }
            if (strict && entry.requireParity != true) {
                throw new GradleException('Strict parity manifest case ' + entry.id
                        + ' must set requireParity=true.')
            }
            if (strict && entry.tolerance.toString() != '0') {
                throw new GradleException('Strict Phase 0 parity requires zero tolerance: ' + entry.id)
            }
            if (strict && !file(entry.cache.toString()).isDirectory()) {
                throw new GradleException('Strict parity cache does not exist for ' + entry.id + ': ' + entry.cache)
            }
            if (strict && !file(entry.fixture.toString()).isDirectory()) {
                throw new GradleException('Strict parity fixture does not exist for ' + entry.id + ': ' + entry.fixture)
            }
            if (strict) strictCoverage << entry.coverage.toString().toLowerCase()
            def cachePath = entry.cache.toString()
            def fixturePath = entry.fixture.toString()
            def regionX = entry.regionX.toString()
            def regionY = entry.regionY.toString()
            def revision = entry.revision.toString()
            logger.lifecycle('OSRS revision matrix case ' + (index + 1) + '/' + cases.size()
                    + ': region ' + regionX + ',' + regionY + ' revision ' + revision)
            project(':Client').javaexec {
                def javaLauncher = project(':Client').javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }.get()
                executable = javaLauncher.executablePath.asFile.absolutePath
                classpath = project(':Client').sourceSets.main.runtimeClasspath
                mainClass = 'com.rspsi.cache.verify.OsrsRevisionVerifier'
                environment 'RSPSI_OSRS_PARITY_FIXTURE', fixturePath
                environment 'RSPSI_OSRS_REQUIRE_PARITY',
                        entry.requireParity == null ? 'false' : entry.requireParity.toString()
                args cachePath, regionX, regionY, revision
            }
        }
        if (strict) {
            def coverage = strictCoverage.join(' ')
            def requiredCoverage = [
                    'plain', 'shaped', 'water', 'bridge', 'effective', 'roof', 'wall',
                    'alpha', 'animated', 'texture', 'occluder', 'boundar'
            ]
            def missingCoverage = requiredCoverage.findAll { token -> !coverage.contains(token) }
            if (!missingCoverage.isEmpty()) {
                throw new GradleException('Strict Phase 0 parity manifest is missing coverage: '
                        + missingCoverage.join(', '))
            }
        }
    }
}

tasks.register('verifyOsrsTextures') {
    description = 'Runs focused real-cache OSRS texture parity against an external textures.json fixture.'
    group = 'verification'
    dependsOn(':Client:classes')
    doLast {
        def cachePath = providers.environmentVariable('RSPSI_OSRS_CACHE').orNull
        def fixturePath = providers.environmentVariable('RSPSI_OSRS_TEXTURE_FIXTURE').orNull
        def revision = providers.environmentVariable('RSPSI_OSRS_REVISION').orNull
        if ([cachePath, fixturePath, revision].any { it == null || it.isBlank() }) {
            throw new GradleException('Set RSPSI_OSRS_CACHE, RSPSI_OSRS_TEXTURE_FIXTURE, and RSPSI_OSRS_REVISION.')
        }
        project(':Client').javaexec {
            def javaLauncher = project(':Client').javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }.get()
            executable = javaLauncher.executablePath.asFile.absolutePath
            classpath = project(':Client').sourceSets.main.runtimeClasspath
            mainClass = 'com.rspsi.cache.verify.OsrsTextureRevisionVerifier'
            args cachePath, revision, fixturePath
        }
    }
}

tasks.register('verifyOsrsInstance') {
    description = 'Runs the opt-in external OSRS instance-template parity fixture.'
    group = 'verification'
    dependsOn(':Client:check')
    doLast {
        def cachePath = providers.environmentVariable('RSPSI_OSRS_CACHE').orNull
        def fixturePath = providers.environmentVariable('RSPSI_OSRS_INSTANCE_FIXTURE').orNull
        def revision = providers.environmentVariable('RSPSI_OSRS_REVISION').orNull
        if ([cachePath, fixturePath, revision].any { it == null || it.isBlank() }) {
            logger.lifecycle('OSRS instance verification: external instance fixture remains pending; '
                    + 'set RSPSI_OSRS_CACHE, RSPSI_OSRS_INSTANCE_FIXTURE, and RSPSI_OSRS_REVISION to run it.')
        } else {
            project(':Client').javaexec {
                def javaLauncher = project(':Client').javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }.get()
                executable = javaLauncher.executablePath.asFile.absolutePath
                classpath = project(':Client').sourceSets.main.runtimeClasspath
                mainClass = 'com.rspsi.cache.verify.OsrsInstanceRevisionVerifier'
                args cachePath, fixturePath, revision
            }
        }
    }
}

def nativeStudioSources = fileTree(project(':Editor').file('src/main/java/com/rspsi/studio')) {
    include '**/*.java'
}

def renderingParityManifestFile = file('docs/RENDERING_PARITY_MANIFEST.json')
def renderingParityReportDirectory = layout.buildDirectory.dir('reports/rendering')

tasks.register('renderingAuditReport') {
    description = 'Validates the checked-in rendering parity matrix and generates Markdown and JSON reports.'
    group = 'verification'
    inputs.file(renderingParityManifestFile)
    outputs.dir(renderingParityReportDirectory)
    doLast {
        if (!renderingParityManifestFile.isFile()) {
            throw new GradleException('Rendering parity manifest does not exist: ' + renderingParityManifestFile)
        }
        def manifest = new groovy.json.JsonSlurper().parse(renderingParityManifestFile)
        if (!(manifest instanceof Map) || manifest.schemaVersion != 1
                || !(manifest.entries instanceof List) || manifest.entries.isEmpty()) {
            throw new GradleException('Rendering parity manifest must be schemaVersion=1 with a non-empty entries array.')
        }
        def allowedStatuses = (manifest.statuses ?: []).collect { it.toString() } as Set
        def required = ['id', 'domain', 'title', 'status', 'priority', 'runelite', 'rspsi', 'tsps', 'evidence', 'nextAction']
        def ids = [] as Set
        manifest.entries.eachWithIndex { entry, index ->
            if (!(entry instanceof Map)) {
                throw new GradleException('Rendering parity entry ' + index + ' must be an object.')
            }
            def missing = required.findAll { key ->
                entry[key] == null || (entry[key] instanceof Collection && entry[key].isEmpty())
                        || (!(entry[key] instanceof Collection) && entry[key].toString().isBlank())
            }
            if (!missing.isEmpty()) {
                throw new GradleException('Rendering parity entry ' + index + ' is missing: ' + missing.join(', '))
            }
            def id = entry.id.toString()
            if (!ids.add(id)) throw new GradleException('Duplicate rendering parity entry: ' + id)
            if (!allowedStatuses.contains(entry.status.toString())) {
                throw new GradleException('Invalid rendering parity status for ' + id + ': ' + entry.status)
            }
            ['runelite', 'rspsi', 'tsps', 'evidence'].each { key ->
                if (!(entry[key] instanceof Collection) || entry[key].any { it == null || it.toString().isBlank() }) {
                    throw new GradleException('Rendering parity entry ' + id + ' must contain non-empty ' + key + ' references.')
                }
            }
            if (['partial', 'blocked', 'deferred'].contains(entry.status.toString())) {
                if (!entry.reason || entry.reason.toString().isBlank()) {
                    throw new GradleException('Rendering parity gap ' + id + ' needs a reason.')
                }
            }
            if (entry.nextAction.toString().isBlank()) {
                throw new GradleException('Rendering parity entry ' + id + ' needs a nextAction.')
            }
        }

        def entries = manifest.entries.collect { entry ->
            [id: entry.id.toString(), domain: entry.domain.toString(), title: entry.title.toString(),
             status: entry.status.toString(), priority: entry.priority.toString(),
             runelite: entry.runelite.collect { it.toString() }, rspsi: entry.rspsi.collect { it.toString() },
             tsps: entry.tsps.collect { it.toString() }, evidence: entry.evidence.collect { it.toString() },
             reason: entry.reason == null ? null : entry.reason.toString(), nextAction: entry.nextAction.toString()]
        }
        def counts = entries.groupBy { it.status }.collectEntries { status, values -> [(status): values.size()] }
        def domains = entries.groupBy { it.domain }.collectEntries { domain, values -> [(domain): values.size()] }
        def report = [schemaVersion: 1, referenceRevision: manifest.referenceRevision,
                      sourceManifest: renderingParityManifestFile.path, generatedFiles: [
                              'build/reports/rendering/rendering-parity.md',
                              'build/reports/rendering/rendering-parity.json'],
                      counts: counts, domains: domains, entries: entries]
        def reportDirectory = renderingParityReportDirectory.get().asFile
        reportDirectory.mkdirs()
        def json = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(report)) + System.lineSeparator()
        file(reportDirectory).toPath().resolve('rendering-parity.json').toFile().text = json

        def markdown = new StringBuilder()
        markdown.append('# Rendering parity audit').append(System.lineSeparator()).append(System.lineSeparator())
        markdown.append('Source: `docs/RENDERING_PARITY_MANIFEST.json`  ').append(System.lineSeparator())
        markdown.append('Reference: `').append(manifest.referenceRevision).append('`').append(System.lineSeparator()).append(System.lineSeparator())
        markdown.append('## Summary').append(System.lineSeparator()).append(System.lineSeparator())
        markdown.append('| Status | Count |').append(System.lineSeparator()).append('|---|---:|').append(System.lineSeparator())
        ['covered', 'partial', 'blocked', 'deferred'].each { status ->
            markdown.append('| ').append(status).append(' | ').append(counts[status] ?: 0).append(' |').append(System.lineSeparator())
        }
        markdown.append(System.lineSeparator()).append('## Matrix').append(System.lineSeparator()).append(System.lineSeparator())
        markdown.append('| ID | Domain | Priority | Status | RuneLite | RSPSi | TSPS | Next action |').append(System.lineSeparator())
        markdown.append('|---|---|---|---|---|---|---|---|').append(System.lineSeparator())
        entries.each { entry ->
            def refs = { values -> values.join('<br>') }
            markdown.append('| `').append(entry.id).append('` | ').append(entry.domain).append(' | ')
                    .append(entry.priority).append(' | ').append(entry.status).append(' | ')
                    .append(refs(entry.runelite)).append(' | ').append(refs(entry.rspsi)).append(' | ')
                    .append(refs(entry.tsps)).append(' | ').append(entry.nextAction.replace('|', '\\|')).append(' |')
                    .append(System.lineSeparator())
        }
        markdown.append(System.lineSeparator()).append('## Documented gaps').append(System.lineSeparator()).append(System.lineSeparator())
        entries.findAll { it.status in ['partial', 'blocked', 'deferred'] }.each { entry ->
            markdown.append('- **').append(entry.id).append('** — ').append(entry.reason).append(' Next: ').append(entry.nextAction).append(System.lineSeparator())
        }
        file(reportDirectory).toPath().resolve('rendering-parity.md').toFile().text = markdown.toString()
        logger.lifecycle('Rendering parity audit: ' + entries.size() + ' entries; ' + counts.collect { key, value -> key + '=' + value }.join(', '))
    }
}

tasks.register('renderingAuditGate') {
    description = 'Validates the rendering parity source manifest without requiring an external cache.'
    group = 'verification'
    dependsOn 'renderingAuditReport'
}

tasks.register('verifyNativeBoundary') {
    description = 'Rejects transitional JavaFX/AWT/settings imports from the native Studio shell.'
    group = 'verification'
    inputs.files(nativeStudioSources)
    doLast {
        def forbidden = [
                'javafx.',
                'javax.swing.',
                'java.awt.',
                'org.lwjgl.opengl.awt.',
                'com.rspsi.options.',
                'com.rspsi.ui.',
                'LegacyRenderSettingsAdapter',
                'AWTGLCanvas',
                'SwingNode',
                'EmbeddedOpenGlViewport'
        ]
        nativeStudioSources.files.each { source ->
            source.eachLine { line, number ->
                if (forbidden.any { token -> line.contains(token) }) {
                    throw new GradleException("Native Studio source crossed a transitional boundary at ${source}:${number}: ${line.trim()}")
                }
            }
        }
    }
}

def loadParityManifest = {
    def manifestPath = providers.environmentVariable('RSPSI_OSRS_PARITY_MANIFEST').orNull
    if (manifestPath == null || manifestPath.isBlank()) {
        throw new GradleException('Set RSPSI_OSRS_PARITY_MANIFEST to the external Phase 0 parity manifest.')
    }
    def manifestFile = file(manifestPath)
    if (!manifestFile.isFile()) {
        throw new GradleException('OSRS parity manifest does not exist: ' + manifestFile)
    }
    def cases = new groovy.json.JsonSlurper().parse(manifestFile)
    if (!(cases instanceof List) || cases.isEmpty()) {
        throw new GradleException('OSRS parity manifest must contain a non-empty JSON array.')
    }
    def required = ['id', 'cache', 'fixture', 'regionX', 'regionY', 'revision',
                    'coverage', 'source', 'cacheFingerprint', 'tolerance']
    cases.eachWithIndex { entry, index ->
        if (!(entry instanceof Map)) {
            throw new GradleException('OSRS parity manifest case ' + index + ' must be an object.')
        }
        def missing = required.findAll { key ->
            entry[key] == null || entry[key].toString().isBlank()
        }
        if (!missing.isEmpty()) {
            throw new GradleException('Phase 0 parity manifest case ' + index
                    + ' is missing: ' + missing.join(', '))
        }
        if (entry.requireParity != true) {
            throw new GradleException('Phase 0 parity manifest case ' + entry.id
                    + ' must set requireParity=true.')
        }
        def cache = file(entry.cache.toString())
        def fixture = file(entry.fixture.toString())
        if (!cache.isDirectory()) {
            throw new GradleException('Phase 0 parity cache does not exist for ' + entry.id + ': ' + cache)
        }
        if (!fixture.isDirectory()) {
            throw new GradleException('Phase 0 parity fixture does not exist for ' + entry.id + ': ' + fixture)
        }
        if (entry.tolerance.toString() != '0') {
            throw new GradleException('Phase 0 parity cases require zero tolerance: ' + entry.id)
        }
    }
    return [manifestFile: manifestFile, cases: cases]
}

tasks.register('parityGate') {
    description = 'Runs strict Phase 0 external cache and semantic/render parity fixtures.'
    group = 'verification'
    dependsOn(':Client:check')
    dependsOn('renderingAuditGate')
    dependsOn('verifyOsrsRevisionMatrix')
}

tasks.register('foundationGate') {
    description = 'Runs deterministic repository foundation checks without external cache dependencies.'
    group = 'verification'
    dependsOn 'test', 'check', ':Client:check', ':Editor:check', 'verifyNativeBoundary', 'renderingAuditGate'
}
