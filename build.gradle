plugins {
    id 'io.freefair.lombok' version '8.14'
    id "com.gradleup.shadow" version "8.3.8" apply false
    id 'application'
    id 'java-library'

    id 'org.beryx.runtime' version '1.13.1' apply false

    id 'org.openjfx.javafxplugin' version '0.1.0'
}

wrapper {
    gradleVersion = '8.14.3'
}

group = 'RSPSi Editor'
version = '1.17.0'

allprojects {
    repositories {
        mavenCentral()
        // OpenRune publishes its dev.or2 modules to this Maven-compatible repo.
        maven { url = uri('https://raw.githubusercontent.com/OpenRune/hosting/master') }
    }
}

subprojects {

    apply plugin: 'java-library'
    apply plugin: 'io.freefair.lombok'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    dependencies {
        api group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.18'
        api group: 'org.checkerframework', name: 'checker-qual', version: '3.49.5'

        api group: 'com.google.guava', name: 'guava', version: '33.4.8-jre'
        api group: 'com.google.code.gson', name: 'gson', version: '2.13.1'

        api group: 'jakarta.servlet', name: 'jakarta.servlet-api', version: '6.1.0'

        testImplementation platform('org.junit:junit-bom:5.12.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    lombok {
        version = "1.18.38"
    }

    compileJava {
        options.fork = true
        options.incremental = true
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    apply plugin: 'org.openjfx.javafxplugin'
    javafx {
        version = "21"
        modules = ['javafx.base', 'javafx.fxml', 'javafx.graphics', 'javafx.controls', 'javafx.media', 'javafx.swing']
    }

}

// The report is intentionally explicit while external parity fixtures remain
// outside the repository: this gate never mutates or silently discovers a
// user cache, and reports real-cache results only when a path is supplied.
tasks.register('verifyOsrsRevision') {
    description = 'Runs the current neutral OSRS cache/map compatibility suite.'
    group = 'verification'
    dependsOn(':Client:check', ':Plugins:OSRSPlugin:check')
    doLast {
        def cachePath = providers.environmentVariable('RSPSI_OSRS_CACHE').orNull
        if (cachePath == null || cachePath.isBlank()) {
            logger.lifecycle('OSRS revision verification: neutral map/location and adapter fixtures passed; real-cache parity remains pending.')
        } else {
            def regionX = providers.environmentVariable('RSPSI_OSRS_REGION_X').orNull
            def regionY = providers.environmentVariable('RSPSI_OSRS_REGION_Y').orNull
            def revision = providers.environmentVariable('RSPSI_OSRS_REVISION').orNull
            def regionArguments = [regionX, regionY, revision]
            if (regionArguments.any { it != null } && regionArguments.any { it == null }) {
                throw new GradleException('Set RSPSI_OSRS_REGION_X, RSPSI_OSRS_REGION_Y, and RSPSI_OSRS_REVISION together.')
            }
            def verifierArguments = [cachePath]
            if (regionArguments.every { it != null }) verifierArguments.addAll(regionArguments)
            project(':Client').javaexec {
                javaLauncher = project(':Client').javaToolchains.launcherFor {
                    languageVersion = JavaLanguageVersion.of(21)
                }
                classpath = project(':Client').sourceSets.main.runtimeClasspath
                mainClass = 'com.rspsi.cache.verify.OsrsRevisionVerifier'
                args verifierArguments
            }
        }
    }
}
